<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Synchronisierte App</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        textarea { width: 100%; height: 150px; font-size: 16px; padding: 10px; }
        button { margin-top: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 10px; font-weight: bold; }
        .loading { color: orange; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

    <h1>Meine Synchronisierten Daten</h1>
    <p>Daten werden live mit der Cloud synchronisiert.</p>

    <textarea id="notizInput" placeholder="Tippe hier deine Notiz ein..."></textarea>
    <br>
    <button id="saveBtn">Speichern & Synchronisieren</button>
    
    <div id="status"></div>

    <script>
        // --- KONFIGURATION EINFÜGEN ---
        const SUPABASE_URL = 'https://dbblynmsqweqdknygfjp.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRiYmx5bm1zcXdlcWRrbnlnZmpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NTk4NDMsImV4cCI6MjEwMzEzNTg0M30.wXeb6kThdYkv7puNkUY-wNbigVfhYKtz1X5RwM-g9dw'; 
        // ------------------------------

        const input = document.getElementById('notizInput');
        const btn = document.getElementById('saveBtn');
        const status = document.getElementById('status');

        // Funktion: Daten von Supabase laden
        async function ladeDaten() {
            status.textContent = "Lade Daten...";
            status.className = "loading";
            
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/daten?order=updated_at.desc&limit=1`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Netzwerkfehler');
                
                const data = await response.json();
                
                if (data.length > 0) {
                    input.value = data[0].inhalt;
                    status.textContent = "Daten geladen.";
                    status.className = "success";
                } else {
                    status.textContent = "Keine Daten gefunden. Starte neu.";
                    status.className = "";
                }
            } catch (err) {
                console.error(err);
                status.textContent = "Fehler beim Laden: " + err.message;
                status.className = "error";
            }
        }

        // Funktion: Daten nach Supabase senden
        async function speichereDaten() {
            const text = input.value;
            if (!text.trim()) return;

            btn.disabled = true;
            status.textContent = "Speichere...";
            status.className = "loading";

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/daten`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation' // Gibt die neue Zeile zurück
                    },
                    body: JSON.stringify({ inhalt: text })
                });

                if (!response.ok) throw new Error('Fehler beim Speichern');
                
                status.textContent = "Erfolgreich gespeichert!";
                status.className = "success";
                btn.disabled = false;
                
                // Optional: Nach 2 Sekunden Status zurücksetzen
                setTimeout(() => { status.textContent = ""; }, 3000);

            } catch (err) {
                console.error(err);
                status.textContent = "Fehler: " + err.message;
                status.className = "error";
                btn.disabled = false;
            }
        }

        // Event Listener
        btn.addEventListener('click', speichereDaten);

        // Beim Laden der Seite Daten abrufen
        window.addEventListener('load', ladeDaten);

        // Automatisch laden, wenn man die Seite neu öffnet (Optional: Polling)
        // Hinweis: In echten Apps nutzt man oft WebSocket-Listen, aber für einfache Nutzung reicht Reload.
    </script>
</body>
</html>
