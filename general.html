<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gartenarchiv Pro</title>
    <!-- Font Awesome für die Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { display: flex; font-family: 'Segoe UI', sans-serif; margin: 0; color: #2d3436; height: 100vh; background: #fafafa; }
        .sidebar { width: 220px; background: #e8f5e9; padding: 25px; border-right: 2px solid #c8e6c9; flex-shrink: 0; }
        .sidebar h1 { color: #2e7d32; font-size: 1.4rem; margin-bottom: 30px; }
        .nav-item { cursor: pointer; padding: 12px 15px; margin-bottom: 5px; border-radius: 8px; transition: 0.3s; font-weight: 500; }
        .nav-item:hover { background: #c8e6c9; color: #2e7d32; }

        .content { padding: 40px; flex-grow: 1; overflow-y: auto; scroll-behavior: smooth; }
        h2 { color: #388e3c; border-bottom: 2px solid #a5d6a7; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        #entryForm { background: #fff; padding: 25px; border-radius: 12px; border: 1px solid #c8e6c9; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        select[multiple] { height: 120px; padding: 5px; }
        .full-width { grid-column: span 2; }

        .search-box { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #c8e6c9; border-radius: 8px; }
        .filter-bar, .sub-filter-bar { margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .filter-label { font-size: 0.8rem; font-weight: bold; color: #666; min-width: 100px; }
        
        .filter-btn { padding: 6px 15px; border: 1px solid #e0e0e0; background: #e0e0e0; border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .filter-btn.active { background: #4caf50; color: white; border-color: #4caf50; }
        .sub-btn-origin { background: #fff; border: 1px solid #add8e6; color: #555; }
        .sub-btn-origin.active { background: #add8e6; color: #000; }

        .entry-count { font-size: 0.9rem; color: #666; margin-bottom: 15px; font-style: italic; }

        .entry-item { background: white; margin-bottom: 15px; border-radius: 10px; border-left: 8px solid #81c784; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; overflow: hidden; min-height: 110px; position: relative; }
        .entry-item[data-category="fauna"] { border-left-color: #ffb74d; }
        .entry-item[data-category="fauna"] .entry-title { color: #ffb74d; }

        .entry-main { padding: 12px 15px; flex-grow: 1; position: relative; }
        .entry-image { width: 110px; flex-shrink: 0; background: #eee; }
        .entry-image img { width: 100%; height: 100%; object-fit: cover; }

        .entry-title { font-weight: bold; font-size: 1.05rem; color: #2e7d32; margin-right: 70px; }
        .entry-meta { font-size: 0.7rem; color: #666; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .entry-details { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 15px; font-size: 0.75rem; margin-top: 5px; }
        .entry-desc { font-size: 0.75rem; color: #444; margin-top: 5px; font-style: italic; }

        .action-btns { position: absolute; top: 12px; right: 15px; display: flex; gap: 5px; z-index: 10; }
        .icon-btn { width: 26px; height: 26px; border-radius: 6px; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 0.85rem; color: white; transition: 0.2s; }
        .btn-edit { background: #bdc3c7; } 
        .btn-edit:hover { background: #95a5a6; }
        .btn-delete { background: #ff7675; } 
        .btn-delete:hover { background: #d63031; }

        /* Neue Giftigkeits-Icons Positionierung */
        .toxicity-icons { position: absolute; top: 45px; right: 15px; display: flex; gap: 2px; }
        .toxicity-icons i { font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="sidebar">
    <h1>Gartenarchiv</h1>
    <div class="nav-item" onclick="showSection('home')">Home</div>
    <div class="nav-item" onclick="showSection('archiv')">Archiv</div>
</div>

<div class="content" id="scrollContainer">
    <div id="home">
        <h2>Willkommen im Garten!</h2>
        <p>Deine persönliche Dokumentation der Natur direkt vor der Tür.</p>
    </div>

    <div id="archiv" style="display:none;">
        <h2>Archiv <button class="filter-btn active" style="background:#2e7d32; color:white;" onclick="prepareNewEntry()">+ Neu</button></h2>
        
        <div id="entryForm" style="display:none;">
            <h3 id="formTitle">Neuer Eintrag</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Typ</label>
                    <select id="categoryInput" onchange="updateFormDynamics()">
                        <option value="flora">Flora</option>
                        <option value="fauna">Fauna</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Unterkategorie</label>
                    <input type="text" id="subInput" list="subcategoryOptions" placeholder="Vorschläge...">
                    <datalist id="subcategoryOptions"></datalist>
                </div>
                <div class="form-group"><label>Name</label><input type="text" id="titleInput"></div>
                <div class="form-group"><label>Wiss. Name</label><input type="text" id="scienceInput"></div>
                
                <div class="form-group" id="originGroup">
                    <label>Wuchs-Status</label>
                    <input type="text" id="originInput" list="originOptions" placeholder="Vorschläge..." oninput="updateFormDynamics()">
                    <datalist id="originOptions"></datalist>
                </div>

                <div class="form-group" id="freqGroup">
                    <label>Häufigkeit</label>
                    <select id="freqInput"></select>
                </div>

                <div class="form-group"><label>Sicherheit</label><select id="confInput"><option value="Sicher">Sicher</option><option value="Unsicher">Unsicher</option></select></div>
                
                <div class="form-group">
                    <label>Ort</label>
                    <input type="text" id="locInput" list="locationOptions" placeholder="Vorschläge...">
                    <datalist id="locationOptions"></datalist>
                </div>

                <div class="form-group" id="toxicGroup">
                    <label>Giftigkeit</label>
                    <select id="toxicInput">
                        <optgroup label="Giftigkeitsstufen">
                            <option value="1">1: Ungiftig / Essbar</option>
                            <option value="2">2: Leicht giftig / bedingt essbar</option>
                            <option value="3">3: Giftig (mäßig bis stark)</option>
                            <option value="4">4: Sehr giftig</option>
                            <option value="5">5: Extrem giftig</option>
                        </optgroup>
                        <optgroup label="Sonstiges">
                            <option value="Unsicher" selected>Unsicher</option>
                        </optgroup>
                    </select>
                </div>
                
                <div class="form-group full-width" id="timeBlock" style="display:none;">
                    <label id="timeLabel">Zeitraum</label>
                    <div id="faunaTimeWrapper">
                        <small style="display:block; margin-bottom:5px; color:#666;">(Strg + Klick für mehrere)</small>
                        <select id="timeSelect" multiple>
                            <optgroup label="Allgemein">
                                <option value="Ganzjährig">Ganzjährig</option>
                                <option value="Frühling">Frühling</option>
                                <option value="Sommer">Sommer</option>
                                <option value="Herbst">Herbst</option>
                                <option value="Winter">Winter</option>
                            </optgroup>
                            <optgroup label="Monate">
                                <option value="Januar">Januar</option><option value="Februar">Februar</option>
                                <option value="März">März</option><option value="April">April</option>
                                <option value="Mai">Mai</option><option value="Juni">Juni</option>
                                <option value="Juli">Juli</option><option value="August">August</option>
                                <option value="September">September</option><option value="Oktober">Oktober</option>
                                <option value="November">November</option><option value="Dezember">Dezember</option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                <div class="form-group full-width"><label>Bild-URL</label><input type="text" id="imgInput"></div>
                <div class="form-group full-width"><label>Notiz</label><textarea id="descInput" rows="2"></textarea></div>
            </div>
            <button class="filter-btn active" style="background:#2e7d32; color:white; margin-top:10px;" onclick="saveEntry()">Speichern</button>
            <button class="btn-link" onclick="toggleForm()">Abbrechen</button>
        </div>

        <input type="text" id="searchInput" class="search-box" placeholder="Suche..." oninput="renderEntries()">
        
        <div class="filter-bar" id="mainFilterBar">
            <span class="filter-label">Hauptfilter:</span>
            <button class="filter-btn active" onclick="setMainFilter('all', this)">Alle</button>
            <button class="filter-btn" onclick="setMainFilter('flora', this)">Flora</button>
            <button class="filter-btn" onclick="setMainFilter('fauna', this)">Fauna</button>
        </div>
        <div class="sub-filter-bar" id="categoryFilterBar"></div>
        <div class="sub-filter-bar" id="originFilterBar"></div>
        <div class="entry-count" id="entryCountText"></div>
        <div id="entryList"></div>
    </div>
</div>

<script>
    let entries = JSON.parse(localStorage.getItem('gartenArchiv')) || [];
    let mainFilter = 'all';
    let selectedSubcategories = [];
    let selectedOrigins = [];
    let editId = null;

    const freqFauna = ["Einzelfund", "Sehr selten", "Selten", "Gelegentlich", "Häufig", "Sehr häufig"];
    const freqFlora = ["Sehr selten", "Selten", "Gelegentlich", "Häufig", "Sehr häufig"];

    function showSection(id) {
        document.getElementById('home').style.display = (id === 'home') ? 'block' : 'none';
        document.getElementById('archiv').style.display = (id === 'archiv') ? 'block' : 'none';
        if(id === 'archiv') renderEntries();
    }

    function toggleForm() {
        const f = document.getElementById('entryForm');
        f.style.display = (f.style.display === 'none') ? 'block' : 'none';
    }

    function prepareNewEntry() {
        editId = null;
        document.getElementById('formTitle').innerText = "Neuer Eintrag";
        ['titleInput', 'scienceInput', 'subInput', 'locInput', 'imgInput', 'descInput', 'originInput'].forEach(i => {
            document.getElementById(i).value = "";
        });
        document.getElementById('toxicInput').value = "Unsicher";
        Array.from(document.getElementById('timeSelect').options).forEach(opt => opt.selected = false);
        updateFormDynamics();
        toggleForm();
    }

    function updateFormDynamics() {
        const cat = document.getElementById('categoryInput').value;
        const origin = document.getElementById('originInput').value;
        const freqGroup = document.getElementById('freqGroup');
        const freqSelect = document.getElementById('freqInput');
        const originGroup = document.getElementById('originGroup');
        const toxicGroup = document.getElementById('toxicGroup');
        const timeBlock = document.getElementById('timeBlock');
        
        freqSelect.innerHTML = '<option value="">-- Keine Angabe --</option>';
        const options = (cat === 'fauna') ? freqFauna : freqFlora;
        options.forEach(opt => {
            const o = document.createElement('option'); o.value = opt; o.innerText = opt; freqSelect.appendChild(o);
        });

        if (cat === 'flora') {
            originGroup.style.display = 'block';
            toxicGroup.style.display = 'block';
            timeBlock.style.display = 'none';
            if (origin === 'Angebaut' || origin === 'Wildwuchs') freqGroup.style.display = 'none';
            else freqGroup.style.display = 'block';
        } else {
            originGroup.style.display = 'none';
            toxicGroup.style.display = 'none';
            freqGroup.style.display = 'block';
            timeBlock.style.display = 'block';
        }
        updateDatalists(cat);
    }

    function updateDatalists(cat) {
        const subDataList = document.getElementById('subcategoryOptions');
        subDataList.innerHTML = "";
        const existingSubs = [...new Set(entries.filter(e => e.category === cat).map(e => e.subcategory))];
        existingSubs.sort().forEach(sub => {
            const o = document.createElement('option'); o.value = sub; subDataList.appendChild(o);
        });
        const locDataList = document.getElementById('locationOptions');
        locDataList.innerHTML = "";
        const existingLocs = [...new Set(entries.map(e => e.location))].filter(l => l && l !== '-');
        existingLocs.sort().forEach(loc => {
            const o = document.createElement('option'); o.value = loc; locDataList.appendChild(o);
        });
        const originDataList = document.getElementById('originOptions');
        originDataList.innerHTML = '<option value="Angebaut"><option value="Wildwuchs"><option value="Keine Angabe">';
    }

    function saveEntry() {
        const cat = document.getElementById('categoryInput').value;
        const origin = document.getElementById('originInput').value;
        const imgVal = document.getElementById('imgInput').value;
        const descVal = document.getElementById('descInput').value;
        
        let timeDisplay = "";
        if(cat === 'fauna') {
            const selectedOptions = Array.from(document.getElementById('timeSelect').selectedOptions);
            timeDisplay = selectedOptions.map(opt => opt.value).join(', ') || "-";
        }

        const entry = {
            category: cat,
            subcategory: document.getElementById('subInput').value || 'Unsortiert',
            title: document.getElementById('titleInput').value,
            science: document.getElementById('scienceInput').value,
            frequency: (cat === 'flora' && (origin === 'Angebaut' || origin === 'Wildwuchs')) ? '-' : (document.getElementById('freqInput').value || '-'),
            origin: cat === 'flora' ? (origin || '-') : '',
            toxic: cat === 'flora' ? document.getElementById('toxicInput').value : '',
            confidence: document.getElementById('confInput').value,
            location: document.getElementById('locInput').value || '-',
            timeValue: timeDisplay,
            img: imgVal || 'https://via.placeholder.com/150?text=Kein+Bild',
            desc: descVal ? descVal.trim() : "",
            id: editId || Date.now()
        };

        if(!entry.title) return alert("Bitte Namen eingeben!");
        if(editId) entries = entries.map(e => e.id === editId ? entry : e); else entries.push(entry);
        localStorage.setItem('gartenArchiv', JSON.stringify(entries));
        renderEntries(); toggleForm();
    }

    function setMainFilter(f, btn) {
        mainFilter = f; selectedSubcategories = []; selectedOrigins = [];
        document.querySelectorAll('#mainFilterBar .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderEntries();
    }

    function toggleSubFilter(value, type) {
        let list = (type === 'cat') ? selectedSubcategories : selectedOrigins;
        const index = list.indexOf(value);
        if (index > -1) list.splice(index, 1); else list.push(value);
        renderEntries();
    }

    function getToxicityHTML(level) {
        if (!level || level === 'Unsicher') {
            return `<div class="toxicity-icons" title="Giftigkeit: Unsicher">
                        <i class="fas fa-skull" style="color: #ddd;"></i>
                        <span style="font-size: 0.65rem; color: #666; margin-left: 2px;">?</span>
                    </div>`;
        }
        const count = parseInt(level);
        let skulls = '';
        for (let i = 1; i <= 5; i++) {
            skulls += `<i class="fas fa-skull" style="color: ${i <= count ? '#e74c3c' : '#ddd'};"></i>`;
        }
        return `<div class="toxicity-icons" title="Giftigkeitsstufe ${level}">${skulls}</div>`;
    }

    function renderEntries() {
        const list = document.getElementById('entryList');
        const catBar = document.getElementById('categoryFilterBar');
        const originBar = document.getElementById('originFilterBar');
        const countText = document.getElementById('entryCountText');
        const search = document.getElementById('searchInput').value.toLowerCase();
        
        catBar.innerHTML = ""; originBar.innerHTML = "";
        if (mainFilter !== 'all') {
            const availableCats = [...new Set(entries.filter(e => e.category === mainFilter).map(e => e.subcategory))].sort();
            if (availableCats.length > 0) {
                catBar.innerHTML = '<span class="filter-label">Kategorien:</span>';
                availableCats.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = `filter-btn ${selectedSubcategories.includes(cat) ? 'active' : ''}`;
                    btn.innerText = cat; btn.onclick = () => toggleSubFilter(cat, 'cat'); catBar.appendChild(btn);
                });
            }
            if (mainFilter === 'flora') {
                const availableOrigins = [...new Set(entries.filter(e => e.category === 'flora').map(e => e.origin))].filter(o => o && o !== '-').sort();
                if (availableOrigins.length > 0) {
                    originBar.innerHTML = '<span class="filter-label">Wuchsstatus:</span>';
                    availableOrigins.forEach(orig => {
                        const btn = document.createElement('button');
                        btn.className = `filter-btn sub-btn-origin ${selectedOrigins.includes(orig) ? 'active' : ''}`;
                        btn.innerText = orig; btn.onclick = () => toggleSubFilter(orig, 'orig'); originBar.appendChild(btn);
                    });
                }
            }
        }

        let filtered = entries.filter(e => {
            const matchesMain = mainFilter === 'all' || e.category === mainFilter;
            const matchesSearch = e.title.toLowerCase().includes(search) || e.science.toLowerCase().includes(search);
            const matchesSub = selectedSubcategories.length === 0 || selectedSubcategories.includes(e.subcategory);
            const matchesOrigin = selectedOrigins.length === 0 || selectedOrigins.includes(e.origin);
            return matchesMain && matchesSearch && matchesSub && matchesOrigin;
        }).sort((a, b) => b.id - a.id);

        countText.innerText = `${filtered.length} Eintrag/Einträge gefunden`;
        list.innerHTML = "";
        filtered.forEach(e => {
            const div = document.createElement('div');
            div.className = 'entry-item';
            div.setAttribute('data-category', e.category);
            const statusLabel = e.origin && e.origin !== '-' ? ` | ${e.origin}` : '';
            
            const freqHTML = (e.category === 'flora' && (e.origin === 'Angebaut' || e.origin === 'Wildwuchs')) 
                ? "" 
                : `<div><strong>Häufigkeit:</strong> ${e.frequency}</div>`;

            const timeHTML = (e.category === 'fauna')
                ? `<div><strong>Zeitraum:</strong> ${e.timeValue}</div>`
                : "";

            // Giftigkeits-Icons generieren (nur für Flora)
            const toxicIcons = (e.category === 'flora') ? getToxicityHTML(e.toxic) : "";

            div.innerHTML = `
                <div class="entry-main">
                    <div class="action-btns">
                        <button class="icon-btn btn-edit" title="Bearbeiten" onclick="editEntry(${e.id})"><i class="fas fa-cog"></i></button>
                        <button class="icon-btn btn-delete" title="Löschen" onclick="deleteEntry(${e.id})"><i class="fas fa-trash"></i></button>
                    </div>
                    ${toxicIcons}
                    <div class="entry-meta">${e.category.toUpperCase()} | ${e.subcategory}${statusLabel}</div>
                    <div class="entry-title">${e.title} <span style="font-style:italic; font-size:0.75rem; color:#666;">${e.science}</span></div>
                    <div class="entry-details">
                        ${freqHTML}
                        <div><strong>Ort:</strong> ${e.location}</div>
                        ${timeHTML}
                    </div>
                    <div class="entry-desc">${e.desc || ""}</div>
                </div>
                <div class="entry-image"><img src="${e.img}"></div>
            `;
            list.appendChild(div);
        });
    }

    function editEntry(id) {
        const e = entries.find(x => x.id === id); editId = id;
        document.getElementById('formTitle').innerText = "Bearbeiten";
        document.getElementById('categoryInput').value = e.category;
        document.getElementById('originInput').value = e.origin || "";
        updateFormDynamics();
        document.getElementById('scrollContainer').scrollTo({ top: 0, behavior: 'smooth' });
        document.getElementById('subInput').value = e.subcategory;
        document.getElementById('titleInput').value = e.title;
        document.getElementById('scienceInput').value = e.science;
        document.getElementById('freqInput').value = (e.frequency === '-') ? "" : e.frequency;
        if(e.toxic) document.getElementById('toxicInput').value = e.toxic;
        document.getElementById('confInput').value = e.confidence;
        document.getElementById('locInput').value = (e.location === '-') ? "" : e.location;
        
        if (e.category === 'fauna') {
            const savedTimes = e.timeValue.split(', ');
            Array.from(document.getElementById('timeSelect').options).forEach(opt => opt.selected = savedTimes.includes(opt.value));
        }
        document.getElementById('imgInput').value = (e.img && !e.img.includes('placeholder')) ? e.img : "";
        document.getElementById('descInput').value = e.desc || "";
        if(document.getElementById('entryForm').style.display === 'none') toggleForm();
    }

    function deleteEntry(id) { if(confirm("Eintrag löschen?")) { entries = entries.filter(e => e.id !== id); localStorage.setItem('gartenArchiv', JSON.stringify(entries)); renderEntries(); } }
    
    renderEntries();
</script>
</body>
</html>
